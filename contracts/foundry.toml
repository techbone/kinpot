[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 120

[lint]
# block-timestamp: due dates and expiries are the product; seconds of drift don't matter at day scale.
# calls-loop: the refund loop is bounded (32 contributors) and isolated per contributor.
# reentrancy-events: KinpotAutomation only calls the immutable Kinpot, which is nonReentrant.
exclude_lints = ["block-timestamp", "calls-loop", "reentrancy-events"]
ignore = ["test/**", "script/**", "src/mocks/**"]
