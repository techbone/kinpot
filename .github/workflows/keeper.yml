# Fallback keeper: pays due pots and refunds expired ones if the Chainlink CRE workflow is down.
# Vercel's Hobby plan only allows daily crons, so GitHub's scheduler calls the endpoint instead.
name: keeper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ vars.KEEPER_URL != '' }}
    steps:
      - name: Call /api/keeper
        run: curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ vars.KEEPER_URL }}/api/keeper"
